name: Relatório automatizado (demo)
on:
  schedule:
    - cron: '20 12 * * 1-5'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gerar relatório com dados fictícios
        run: python -m scripts.daily_report --input data/sample_incidents.json --output reports/relatorio_diario.md
      - uses: actions/upload-artifact@v4
        with:
          name: logipilot-relatorio-demo
          path: reports/relatorio_diario.md
          retention-days: 14
